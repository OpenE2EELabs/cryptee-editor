name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/package.json
      - working-directory: editor
        run: npm ci
      - working-directory: editor
        run: npm run typecheck
      - working-directory: editor
        run: npm test
      - working-directory: editor
        run: npm run lint

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package.json
      - working-directory: relay
        run: npm install
      - working-directory: relay
        run: npm run typecheck
